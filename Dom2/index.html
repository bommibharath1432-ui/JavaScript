<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./css/custom.css" />

  </head>
  <body>
    <div class="container">
        <h1 id="title"></h1>
      <div class="form-group">
        <label>Input A</label>
        <input type="number" id="inputa" />
      </div>
       <div class="form-group">
        <label>Input B</label>
        <input type="number" id="inputb" />
      </div>
      <div>
        <span id="result"></span>
      </div>
      <div>
        <button id="+" onclick="calculate(this.id)">+</button>
        <button id="-" onclick="calculate(this.id)">-</button>
        <button id="x" onclick="calculate(this.id)">*</button>
        <button id="/" onclick="calculate(this.id)">/</button>
        <button id="%" onclick="calculate(this.id)">%</button>
      </div>
    </div>

        <script src="./js/custom.js"></script>
  </body>
</html>
