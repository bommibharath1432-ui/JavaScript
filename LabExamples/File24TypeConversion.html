<html> 
<head> 
<title>JavaScript Data Conversion</title> 
</head> 
<body>
<script> 
document.write("<br>parseFloat - " + (parseFloat("77.3")+5)); 
document.write("<br>parseInt - " + (parseInt("77.3")+5)); 
document.write("<br>parseInt - " + (parseInt("123.45")+5)); 
document.write("<br>Number - " + (Number("2.34")+5)); 
document.write("<br>Implicit Conversion - " + ("2.34" - 1));
</script>
</body> 
</html>
