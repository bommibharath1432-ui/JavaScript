<html>
<head><title>Validations</title>
<script>
function myFunction() {
    var txt = "";
    if (document.getElementById("id1").validity.rangeUnderflow) {
        txt = "Value too small";
    } 
	else {
        txt = "Input OK";
    }
    document.getElementById("demo").innerHTML = txt;
}
</script>
</head>
<body>
<p>Enter a number and click OK:</p>

<input id="id1" type="number" min=10 >
<button onclick="myFunction()">OK</button>

<p>If the number is Lessthan 10 (the input's min attribute), an error message will be displayed.</p>

<p id="demo"></p>

</body>
</html>
