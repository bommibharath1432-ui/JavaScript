<html>
<head><title>While Loop</title>
<script>
function myFun()
{
var n=parseInt(document.getElementById("txtinput").value);
var i;
var result="";
i=1;
while(i<=10)
{
result=result + n + " X " + i + " = " + n*i + "</br>"
i++;
}

document.getElementById("Result").innerHTML=result;
}
</script>
</head>
<body>

A Value <input type="textbox" id="txtinput"/></br>
<p id="Result">
Result Place Here
</p>
<button type="button" onclick="myFun()">Print Multiple Table</button>
</body>

</html>
