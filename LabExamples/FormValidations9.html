<!DOCTYPE html>  
<html>  
<head>  
<title>JavaScript All Numbers Validations</title>  
</head>  
<body onload='document.form1.text1.focus()'>  
<div class="numbercheck">  
<h2>Input your registration number and submit</h2>  
<form name="form1" action="#">  
<ul style="display:inline;">  
<li><input type='text' name='text1'/></li>  
<li >*Enter numbers only.</li>  
<li>&nbsp;</li>  
<li><input type="submit" name="submit" value="Submit" 
onclick="allnumericplusminus(document.form1.text1)" /></li>  
<li>&nbsp;</li>  
</ul>  
</form>  
</div>  
<script>
function allnumericplusminus(inputtxt)  
   {  
      var numbers = /^[-+]?[0-9]+$/;  
      if(inputtxt.value.match(numbers))  
      {  
      document.form1.text1.focus();  
      return true;  
      }  
      else  
      {  
      alert('Please input correct format');  
      document.form1.text1.focus();  
      return false;  
      }  
   }  
   </script>  
</body>  
</html>
