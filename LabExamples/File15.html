<html>
<head><title>Logical Operators</title></head>
<body>
<script type="text/javascript">
var a = true;
var b = false;
var linebreak = "<br />";
result = (a && b);
document.write("(a && b) => "+result);
document.write(linebreak);
result = (a || b);
document.write("(a || b) => "+result);
document.write(linebreak);
result = (!(a && b));
document.write("!(a && b) => "+result);
document.write(linebreak);
</script>
</body>
</html>
