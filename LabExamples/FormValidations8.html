<!DOCTYPE html>  
<html>  
<head>  
<title>JavaScript All Numbers Validations</title>  
</head>  
<body onload='document.form1.text1.focus()'>  
<div >  
<h2>Input your registration number and submit</h2>  
<form name="form1" action="#">  

<input type='text' name='text1'/> *Enter numbers only.</br>
<input type="submit" name="submit" value="Submit" onclick="allnumeric(document.form1.text1)" />
</form>  
</div>  
<script>
function allnumeric(inputtxt)  
   {  
      var numbers = /^[0-9]+$/;  
      if(inputtxt.value.match(numbers))  
      {  
      alert('Your Registration number has accepted....');  
      document.form1.text1.focus();  
      return true;  
      }  
      else  
      {  
      alert('Please input numeric characters only');  
      document.form1.text1.focus();  
      return false;  
      }  
   }   
   </script>  
</body>  
</html>
