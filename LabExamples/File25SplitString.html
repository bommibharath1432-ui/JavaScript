<html>
  <head>
    <title>Split The String</title>
  </head>
  <body>
    <script>
      re = /\$/;
      target = "Welecome$to$kkcc$info$systems$students";
      result = target.split(re);
      document.write("Length: " + result.length + "<br>");
      for (i = 0; i < result.length; i++) {
        document.write(result[i] + "<br>");
      }
    </script>
  </body>
</html>
