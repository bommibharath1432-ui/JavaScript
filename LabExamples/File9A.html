<HTML>
<HEAD>
<SCRIPT LANGUAGE="JavaScript">

function changecolor(code) {

document.bgColor=code
}

</SCRIPT>

</HEAD>
<BODY>

<form>
<input type="button" id="red" name="Button1" value="RED" onclick="changecolor(this.id)">

<input type="button" id="green" name="Button2" value="GREEN" onclick="changecolor(this.id)">

<input type="button" id="blue" name="Button3" value="BLUE" onclick="changecolor(this.id)">

<input type="button" id="white" name="Button4" value="WHITE" onclick="changecolor(this.id)">

</form>

</BODY>
</HTML>
