<html>
<head><title>Conditional Operators</title></head>
<body>
<script type="text/javascript">
var a = 20;
var b = 10;
var linebreak = "<br />";
result=(a>b) ? "Pass" : "Fail";
document.write ("((a > b) ? Pass : Fail) => "+result);
document.write(linebreak);
result = (a < b) ? 100 : 200;
document.write ("((a < b) ? 100 : 200) => "+result);
document.write(linebreak);
</script>

</body>
</html>
