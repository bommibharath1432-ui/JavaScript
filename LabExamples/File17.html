<html>
<head><title>Type Checking with Conditional Operators</title></head>
<body>
<script type="text/javascript">
var a = "Rajesh";
var b = 10;
var c=4.56;
var linebreak = "<br />";
result = (typeof b == "string" ? "B is String" : "B is Numeric");
document.write("Result => ");
document.write(result);
document.write(linebreak);
result = (typeof a == "string" ? "A is String" : "A is Numeric");
document.write("Result => ");
document.write(result);
document.write(linebreak);
result = (typeof c == "string" ? "c is String" : "c is Float");
document.write("Result => ");
document.write(result);
document.write(linebreak);
</script>
</body>
</html>
