<html>
<head><title>Relational Operators</title></head>
<body>
<script type="text/javascript">
var a = 10;
var b = 20;
var linebreak = "<br />";
result = (a == b);
document.write("(a == b) => "+result);
document.write(linebreak);
result = (a < b);
document.write("(a < b) => "+result);
document.write(linebreak);
result = (a > b);
document.write("(a > b) => "+result);
document.write(linebreak);
result = (a != b);
document.write("(a != b) => "+result);
document.write(linebreak);
result = (a >= b);
document.write("(a >= b) => "+result);
document.write(linebreak);
result = (a <= b);
document.write("(a <= b) => "+result);
document.write(linebreak);
</script>
</body>
</html>
