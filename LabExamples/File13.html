<html>
<head><title>Arithmatic Operations</title>
</head>
<body>
<script type="text/javascript">
let a = 33;
let b = 10;
let c = "KKCC";
let linebreak = "<br />";
result = a + b;
document.write("a + b = "+result);
document.write(linebreak);
result = a - b;
document.write("a - b = "+result);
document.write(linebreak);
result = a / b;
document.write("a / b = "+result);
document.write(linebreak);
result = a % b;
document.write("a % b = "+result);
document.write(linebreak);
result = a + b + c;
document.write("a + b + c = "+result);
document.write(linebreak);
a = ++a;
result = ++a;
document.write("a++ = "+result);
document.write(linebreak);
b = --b;
result = b;
document.write("b-- = " + result);
document.write(linebreak);
</script>

</body>
</html>
