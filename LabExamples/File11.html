<SCRIPT LANGUAGE="JavaScript">

function MyWindow(message) {
now = new Date();
LocalTime = now.toLocaleString();
contents='<html>';
contents=contents + '<head><title>PopUp</title></head>';
contents=contents + '<body>';
contents=contents +'<h1>'+message+'</h1><A HREF="javascript:window.close()" >';
contents=contents + 'Back</A>'
contents=contents + '</body>';
contents=contents + '</html>';
/*alert(contents);*/
options="toolbar=0,status=0,menubar=0,scrollbars=0,resizable=0,width=300,height=200";

newwindow=window.open("","mywindow", options);
newwindow.document.write(LocalTime);
newwindow.document.write(contents);
newwindow.document.close();
}
