<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div>
      <div>
        <label>Enter any Number</label>
        <input type="number" id="num" />
      </div>
      <div>
        <span id="result"></span>
      </div>
      <div>
        <button id="prime">Prime Or Not</button>
      </div>
    </div>
    <script>
      let numElement = document.getElementById("num");
      let resultElement = document.getElementById("result");
      let primeButtonElement = document.getElementById("prime");

      function isPrime() {
        let count = 0;
        let n = parseInt(numElement.value);
        // alert(n);
        for (let i = 2; i < n; i++) {
          if (n % i === 0) {
            count++;
          }
        }
        if (count == 0) {
          resultElement.innerText = "Its Prime";
        } else {
          resultElement.innerText = "Its Not Prime";
        }
      }
      primeButtonElement.addEventListener("click", isPrime);
    </script>
  </body>
</html>
